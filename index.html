<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>StatFit</title>
</head>
<body>
    <header class="cabecera">
        <section>
            <img class="logo" src="assets/logo.png" alt="Logo">
        </section>
        <nav class="cabecera__navegador">
            <ul class="navegador__cabeceraUl">
                <li class="cabeceraUl__cabeceraLi"><a href="index.html">Inicio</a></li>
                <li class="cabeceraUl__cabeceraLi"><a href="ejercicios.html">Ejercicios</a></li>
                <li class="cabeceraUl__cabeceraLi"><a href="registro.html">Registro</a></li>
                <li class="cabeceraUl__cabeceraLi"><a href="contacto.html">Contacto</a></li>
                <li class="cabeceraUl__cabeceraLi"><a href="calorias.html">Calorías</a></li>
                <img class="cabeceraUl__imgInicioSesion" src="/assets/iconoSesion.png" alt="IconoInicioSesion">
            </ul>
        </nav>
    </header>
    <main class="mainInicio">
        <section class="mainInicio__sectionInicioBotones">
            <article class="sectionInicioBotones__tituloInicioBotones seccionPrincipal">
                <h1 class="tituloInicioBotones__tituloSeciones titulo">Es el momento de tu cambio físico</h1>
                <p class="tituloInicioBotones__subtituloSeciones subtitulo">Guarda tu progreso registrando tus ejercicios</p>
            </article>
            <article class="sectionInicioBotones__articleBotones">
                <button class="articleBotones__botonPrimary">Registrarse</button>
                <button class="articleBotones__botonSurface">Iniciar Sesión</button>
            </article>
        </section>
        <section class="mainInicio__sectionInicioCaloriasEjercicios">
            <section class="sectionInicioCaloriasEjercicios__sectionCrearRutina">
                <h1 class="sectionCrearRutina__tituloSeciones titulo">Creación de rutinas</h1>
                <section class="sectionCrearRutina__rutinas">
                    <article class="rutinas__articuloRutina">
                        <img class="articuloRutina__tipoEjercicio" src="assets/calisteniaOscuro.png" alt="">
                        <p class="articuloRutina__subtituloSecciones subtitulo">Calistenia</p>
                    </article>
                    <article class="rutinas__articuloRutina">
                        <img class="articuloRutina__tipoEjercicio" src="assets/casaOscuro.png" alt="">
                        <p class="articuloRutina__subtituloSecciones subtitulo">Casa</p>
                    </article>
                    <article class="rutinas__articuloRutina">
                        <img class="articuloRutina__tipoEjercicio" src="assets/gimnasioOscuro.png" alt="">
                        <p class="articuloRutina__subtituloSecciones subtitulo">Gimnasio</p>
                    </article>
                </section>
            </section>
            <section class="mainInicio__sectionCaloriasInicio">
                <h1 class="sectionCaloriasInicio__tituloSeciones titulo">Calorías</h1>
                <article class="sectionCaloriasInicio__caloriasDiarias">
                    <section class="caloriasDiarias__sectionP">
                        <p class="caloriasDiarias__calorias calorias">Calorías Diarias</p>
                        <p class="caloriasDiarias__calorias calorias">1850/2400Kcal</p>
                    </section>
                    <progress class="caloriasDiarias__progressBar" value="70" max="100"> 70% </progress>
                </article>
                <article class="sectionCaloriasInicio__caloriasPersonales">
                    <p class="caloriasPersonales__calorias calorias">Calorías Personales</p>
                </article>
            </section>
        </section>
    </main>
</body>
</html>
