<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>StatFit — Regístrate</title>
</head>
<body>
<script src="js/registro.js" type="module"></script>
<header class="cabecera">
    <section>
        <img class="logo" src="assets/logo.png" alt="Logo">
    </section>
    <nav class="cabecera__navegador">
        <ul class="navegador__cabeceraUl">
            <li class="cabeceraUl__cabeceraLi"><a href="index.html">Inicio</a></li>
            <li class="cabeceraUl__cabeceraLi"><a href="ejercicios.html">Ejercicios</a></li>
            <li class="cabeceraUl__cabeceraLi"><a href="calorias.html">Calorías</a></li>
            <img class="cabeceraUl__imgInicioSesion" src="/assets/iconoSesion.png" alt="IconoInicioSesion">
        </ul>
    </nav>
</header>
<main class="main-formularios main-formularios--registro">
    <section class="main-formularios__registro" aria-labelledby="titulo-registro">
        <form class="formulario" id="form-registro" action="#" method="POST" novalidate>
            <header class="formulario__cabecera">
                <img class="formulario__logo" src="assets/logo.png" alt="Logo">
                <h1 class="formulario__titulo" id="titulo-registro">Regístrate</h1>
            </header>

            <article class="formulario__grupo">
                <label class="formulario__etiqueta" for="nombre">Nombre Usuario</label>
                <input class="formulario__campo" type="text" id="nombre" name="nombre" placeholder="Ej. Carlos Garcia" minlength="4" maxlength="10" required>
            </article>

            <article class="formulario__grupo">
                <label class="formulario__etiqueta" for="correo">Correo</label>
                <input class="formulario__campo" type="email" id="correo" name="correo" aria-label="Correo electrónico" placeholder="Ej. carlosgarcia@gmail.com" required>
            </article>

            <article class="formulario__grupo">
                <label class="formulario__etiqueta" for="password">Contraseña</label>
                <input class="formulario__campo" type="password" id="password" name="password" placeholder="**********" minlength="8" required>
            </article>

            <article class="formulario__grupo">
                <label class="formulario__etiqueta" for="confirm-password">Confirmar contraseña</label>
                <input class="formulario__campo" type="password" id="confirm-password" name="confirm-password" placeholder="**********" minlength="8" required>
            </article>

            <article class="formulario__grupo">
                <label class="formulario__etiqueta" for="fecha">Fecha de nacimiento</label>
                <input class="formulario__campo formulario__campo--fecha" type="date" id="fecha" name="fecha" max="2026-11-24" required>
            </article>

            <article class="formulario__grupo formulario__grupo--condiciones">
                <label class="formulario__etiqueta formulario__etiqueta--inline" for="condiciones">Acepto condiciones:</label>
                <input class="formulario__checkbox" type="checkbox" id="condiciones" name="condiciones" required>
            </article>

            <button class="formulario__boton" type="submit">Registrarse</button>

            <footer class="formulario__pie">
                <p class="formulario__texto-pie">
                    ¿Tienes cuenta? <a class="formulario__enlace" href="#">Inicia Sesion</a>
                </p>
            </footer>
        </form>
    </section>

    <section class="main-formularios__mensajes" aria-labelledby="titulo-usuarios">
        <section class="mensajes-enviados">
            <h2 class="mensajes-enviados__titulo" id="titulo-usuarios">Usuarios registrados</h2>
            <section class="mensajes-enviados__lista" id="lista-usuarios">
                <article class="mensaje-card">
                    <header class="mensaje-card__cabecera">
                        <h3 class="mensaje-card__motivo">Carlos</h3>
                        <section class="mensaje-card__acciones">
                            <button class="mensaje-card__editar" type="button">Editar</button>
                            <button class="mensaje-card__borrar" type="button">Borrar</button>
                        </section>
                    </header>
                    <p class="mensaje-card__autor">carlosgarcia@gmail.com</p>
                    <p class="mensaje-card__texto">Nacimiento: 2000-05-12</p>
                </article>
            </section>
        </section>
    </section>
</main>
</body>
</html>
