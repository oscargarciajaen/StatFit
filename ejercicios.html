<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>StatFit - Ejercicios</title>
</head>
<body>
<header class="cabecera">
    <section>
        <img class="logo" src="assets/logo.png" alt="Logo">
    </section>
    <nav class="cabecera__navegador">
        <ul class="navegador__cabeceraUl">
            <li class="cabeceraUl__cabeceraLi"><a href="index.html">Inicio</a></li>
            <li class="cabeceraUl__cabeceraLi"><a href="ejercicios.html">Ejercicios</a></li>
            <li class="cabeceraUl__cabeceraLi"><a href="registro.html">Registro</a></li>
            <li class="cabeceraUl__cabeceraLi"><a href="contacto.html">Contacto</a></li>
            <li class="cabeceraUl__cabeceraLi"><a href="calorias.html">Calorías</a></li>
            <img class="cabeceraUl__imgInicioSesion" src="/assets/iconoSesion.png" alt="IconoInicioSesion">
        </ul>
    </nav>
</header>

<main class="mainInicio">
    <section class="mainInicio__sectionInicioBotones">
        <article class="sectionInicioBotones__tituloInicioBotones">
            <h1 class="tituloInicioBotones__tituloSeciones titulo">Crea aquí tus propios entrenamientos</h1>
            <p class="tituloInicioBotones__subtituloSeciones subtitulo">Registra aquí tus entrenamientos para mantener un seguimiento</p>
        </article>
        <article class="sectionInicioBotones__articleBotones">
            <button class="articleBotones__botonPrimary">Crea aquí tu rutina</button>
        </article>
    </section>

    <section class="mainInicio__sectionInicioCaloriasEjercicios">
        <section class="sectionInicioCaloriasEjercicios__sectionCrearRutina">
            <h1 class="sectionCrearRutina__tituloSeciones titulo">Creación de rutinas</h1>
            <section class="sectionCrearRutina__rutinas">
                <article class="rutinas__articuloRutina">
                    <img class="articuloRutina__tipoEjercicio" src="assets/calisteniaOscuro.png" alt="Calistenia">
                    <p class="articuloRutina__subtituloSecciones subtitulo">Calistenia</p>
                </article>
                <article class="rutinas__articuloRutina">
                    <img class="articuloRutina__tipoEjercicio" src="assets/casaOscuro.png" alt="Casa">
                    <p class="articuloRutina__subtituloSecciones subtitulo">Casa</p>
                </article>
                <article class="rutinas__articuloRutina">
                    <img class="articuloRutina__tipoEjercicio" src="assets/gimnasioOscuro.png" alt="Gimnasio">
                    <p class="articuloRutina__subtituloSecciones subtitulo">Gimnasio</p>
                </article>
            </section>
        </section>

        <section class="mainInicio__EjercicioAñadirPeso">
            <h1 class="EjercicioAñadirPeso__tituloSeciones titulo">Adición de pesos</h1>
            <article class="EjercicioAñadirPeso__registroPeso">
                <section class="registroPeso__sectionP">
                    <p class="registroPeso__texto calorias">Día de pecho</p>
                    <p class="registroPeso__accion calorias">Registrar pesos ></p>
                </section>
            </article>
            <article class="EjercicioAñadirPeso__registroPeso2">
                <section class="registroPeso__sectionP">
                    <p class="registroPeso__texto calorias">Día de espalda</p>
                    <p class="registroPeso__accion calorias">Registrar pesos ></p>
                </section>
            </article>
        </section>
    </section>
</main>
</body>
</html>
